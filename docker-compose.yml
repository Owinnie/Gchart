services:
  cube:
    image: cube-env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cube
    restart: always
    ports:
      - "4000:4000"
      - "15432:15432"
    # Mount the repo read-only at conf.src. start.sh syncs into /cube/conf and
    # injects visibility flags only in that container-local copy — the bind
    # mount (and git status) stay clean.
    volumes:
      - ./cube_conf:/cube/conf.src:ro
    env_file:
      - .env
    environment:
      CUBE_CONF_SRC: /cube/conf.src
      CUBE_CONF_DST: /cube/conf
      CUBE_INJECT_VISIBILITY: "1"
    depends_on:
      - cubestore

  cubestore:
    image: cubejs/cubestore:v1.3.77
    platform: linux/amd64
    container_name: cubestore
    restart: always
    ports:
      - "3030:3030"
    volumes:
      - ./cubestore_data:/cube/data
